global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: fraud-decisioning-platform
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: demo-analyst-key
    static_configs:
      - targets: [app:8080]
