spring:
  application.name: fraud-decisioning-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DATABASE_USERNAME:fraud}
    password: ${DATABASE_PASSWORD:fraud}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
fraud:
  security:
    credentials:
      - name: merchant-demo
        tenant-id: merchant-demo
        key-sha256: ${MERCHANT_API_KEY_SHA256:d09453e5d5a47120605987b7b9cda1e9469ccf81d6864edb0c9af39287900749}
        scopes: [DECISIONS_WRITE, DECISIONS_READ, FEEDBACK_WRITE, FEEDBACK_READ, RULES_READ]
      - name: analyst-demo
        tenant-id: merchant-demo
        key-sha256: ${ANALYST_API_KEY_SHA256:ba041bbd3d5f84055d10645d916eeace5ad28692224918c320e627f95bccbd3b}
        scopes: [DECISIONS_READ, REVIEWS_READ, REVIEWS_WRITE, FEEDBACK_WRITE, FEEDBACK_READ, RULES_READ, RULES_WRITE, OPERATIONS_READ]
  shadow-model:
    enabled: ${SHADOW_MODEL_ENABLED:true}
    version: ${SHADOW_MODEL_VERSION:candidate-2026-10}
    review-threshold: ${SHADOW_REVIEW_THRESHOLD:40}
    decline-threshold: ${SHADOW_DECLINE_THRESHOLD:75}
  velocity:
    window-seconds: ${VELOCITY_WINDOW_SECONDS:300}
    failure-policy: ${VELOCITY_FAILURE_POLICY:FAIL_REVIEW}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
server:
  shutdown: graceful
