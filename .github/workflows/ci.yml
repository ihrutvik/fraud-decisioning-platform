name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: mvn --batch-mode verify
      - run: terraform -chdir=deploy/aws init -backend=false && terraform -chdir=deploy/aws validate
      - run: docker compose config --quiet
      - run: docker run --rm -v "$PWD/load:/scripts:ro" grafana/k6:0.54.0 inspect /scripts/decision-load.js
      - run: docker run --rm -v "$PWD/load:/scripts:ro" grafana/k6:0.54.0 inspect /scripts/idempotency-smoke.js
      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t fraud-decisioning-platform:${{ github.sha }} .
      - name: Create artifact checksum
        run: sha256sum target/fraud-decisioning-platform-1.0.0.jar > target/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: fraud-decisioning-platform-${{ github.sha }}
          path: |
            target/fraud-decisioning-platform-1.0.0.jar
            target/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
