services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: fraud, POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fraud"], interval: 5s, timeout: 3s, retries: 10}
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  app:
    build: .
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}, redis: {condition: service_healthy}}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fraud
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      MERCHANT_API_KEY_SHA256: d09453e5d5a47120605987b7b9cda1e9469ccf81d6864edb0c9af39287900749
      ANALYST_API_KEY_SHA256: ba041bbd3d5f84055d10645d916eeace5ad28692224918c320e627f95bccbd3b
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
    ports: ["8080:8080"]
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: {app: {condition: service_started}}
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: {prometheus: {condition: service_started}}
